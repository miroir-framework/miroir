<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Miroir layered architecture</title>
  <desc>Concentric rings. At the centre, ML: the application DSL, whose vocabulary is Entity, Query, Transformer, Report and Action. Around it, 2_domain interprets ML, then 3_controllers, 4_services / 4_views, and the infrastructure packages; 5_setup wires them. Implementation dependencies point inward.</desc>
  <defs>
    <!-- Text arcs, centre (360,360). Top arcs read left to right over the top; bottom arcs read left to right under the bottom. -->
    <path id="top-pkg"  d="M 70,360 A 290 290 0 0 1 650,360"/>
    <path id="bot-pkg"  d="M 60,360 A 300 300 0 0 0 660,360"/>
    <path id="top-svc"  d="M 127,360 A 233 233 0 0 1 593,360"/>
    <path id="bot-svc"  d="M 117,360 A 243 243 0 0 0 603,360"/>
    <path id="top-ctl"  d="M 179,360 A 181 181 0 0 1 541,360"/>
    <path id="bot-ctl"  d="M 169,360 A 191 191 0 0 0 551,360"/>
    <path id="top-dom"  d="M 229,360 A 131 131 0 0 1 491,360"/>
    <path id="bot-dom"  d="M 219,360 A 141 141 0 0 0 501,360"/>
    <path id="bot-core" d="M 262,360 A 98 98 0 0 0 458,360"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E2A9A"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="720" rx="18" fill="#2E2A9A"/>

  <!-- 5_setup: composition root around everything -->
  <circle cx="360" cy="360" r="342" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 7" opacity="0.8"/>

  <!-- Rings, outermost first -->
  <circle cx="360" cy="360" r="325" fill="#FFEB8A" stroke="#2E2A9A" stroke-width="3"/>
  <circle cx="360" cy="360" r="265" fill="#D7AEF5" stroke="#2E2A9A" stroke-width="3"/>
  <circle cx="360" cy="360" r="210" fill="#B9D7FF" stroke="#2E2A9A" stroke-width="3"/>
  <circle cx="360" cy="360" r="160" fill="#9EF5E1" stroke="#2E2A9A" stroke-width="3"/>
  <circle cx="360" cy="360" r="110" fill="#FFC4B4" stroke="#2E2A9A" stroke-width="3"/>

  <g fill="#2E2A9A" text-anchor="middle">
    <!-- Packages: frameworks and drivers -->
    <text font-size="17" font-weight="700"><textPath href="#top-pkg" startOffset="50%">Packages: stores · local cache · UI · server · tools</textPath></text>
    <text font-size="13" font-weight="600"><textPath href="#bot-pkg" startOffset="50%">miroir-store-* · miroir-localcache-redux · miroir-react · miroir-server · miroir-mcp · miroir-cli</textPath></text>

    <!-- 4_services / 4_views: adapters -->
    <text font-size="17" font-weight="700"><textPath href="#top-svc" startOffset="50%">4_services · 4_views</textPath></text>
    <text font-size="13" font-weight="600"><textPath href="#bot-svc" startOffset="50%">PersistenceStoreController · RestClient · RestServer · Logger</textPath></text>

    <!-- 3_controllers: use-case orchestration -->
    <text font-size="17" font-weight="700"><textPath href="#top-ctl" startOffset="50%">3_controllers</textPath></text>
    <text font-size="13" font-weight="600"><textPath href="#bot-ctl" startOffset="50%">DomainController · ActionRunner</textPath></text>

    <!-- 2_domain: interpreters of ML -->
    <text font-size="16" font-weight="700"><textPath href="#top-dom" startOffset="50%">2_domain: ML interpreters</textPath></text>
    <text font-size="12" font-weight="600"><textPath href="#bot-dom" startOffset="50%">query runners · transformer engine · templates</textPath></text>

    <!-- Centre: ML, the application DSL, and its vocabulary -->
    <text x="360" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">ML</text>
    <text x="360" y="379" font-size="11" font-weight="600">application DSL</text>
    <text font-size="10" font-weight="600" opacity="0.8"><textPath href="#bot-core" startOffset="50%">0_interfaces · 1_core</textPath></text>
  </g>

  <!-- The five concepts ML is grounded on, around the centre -->
  <g font-size="12" font-weight="700" fill="#2E2A9A" text-anchor="middle">
    <g stroke="#2E2A9A" stroke-width="1.5" fill="#FFF3EE">
      <rect x="336" y="287" width="48" height="20" rx="10"/>
      <rect x="397" y="331" width="46" height="20" rx="10"/>
      <rect x="355" y="400" width="84" height="20" rx="10"/>
      <rect x="290" y="400" width="54" height="20" rx="10"/>
      <rect x="276" y="331" width="52" height="20" rx="10"/>
    </g>
    <text x="360" y="301">Entity</text>
    <text x="420" y="345">Query</text>
    <text x="397" y="414">Transformer</text>
    <text x="317" y="414">Report</text>
    <text x="302" y="345">Action</text>
  </g>

  <!-- Dependency direction: from the outer ring towards the centre, on the empty left side of the rings -->
  <line x1="44" y1="360" x2="248" y2="360" stroke="#2E2A9A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="58" y="352" font-size="11" font-weight="600" fill="#2E2A9A">depends on</text>

  <!-- Title -->
  <text x="740" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#FFFFFF">Miroir Architecture</text>
  <text x="742" y="108" font-size="14" fill="#C9C6F5">Clean / hexagonal layering of packages/*/src</text>

  <!-- Legend: Miroir layer and its Clean Architecture counterpart -->
  <g font-size="15" fill="#FFFFFF">
    <rect x="742" y="150" width="20" height="20" rx="3" fill="#FFC4B4" stroke="#FFFFFF"/>
    <text x="776" y="165" font-weight="600">ML, the application DSL</text>
    <text x="776" y="185" font-size="12.5" fill="#C9C6F5">Enterprise business rules</text>

    <rect x="742" y="210" width="20" height="20" rx="3" fill="#9EF5E1" stroke="#FFFFFF"/>
    <text x="776" y="225" font-weight="600">ML interpreters (pure)</text>
    <text x="776" y="245" font-size="12.5" fill="#C9C6F5">Application business rules</text>

    <rect x="742" y="270" width="20" height="20" rx="3" fill="#B9D7FF" stroke="#FFFFFF"/>
    <text x="776" y="285" font-weight="600">Controllers, action execution</text>
    <text x="776" y="305" font-size="12.5" fill="#C9C6F5">Use-case orchestration</text>

    <rect x="742" y="330" width="20" height="20" rx="3" fill="#D7AEF5" stroke="#FFFFFF"/>
    <text x="776" y="345" font-weight="600">Services, views</text>
    <text x="776" y="365" font-size="12.5" fill="#C9C6F5">Interface adapters</text>

    <rect x="742" y="390" width="20" height="20" rx="3" fill="#FFEB8A" stroke="#FFFFFF"/>
    <text x="776" y="405" font-weight="600">Store, cache, UI, server packages</text>
    <text x="776" y="425" font-size="12.5" fill="#C9C6F5">Frameworks &amp; drivers</text>

    <circle cx="752" cy="460" r="10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="776" y="465" font-weight="600">5_setup</text>
    <text x="776" y="485" font-size="12.5" fill="#C9C6F5">Composition root: wires implementations</text>

    <line x1="742" y1="520" x2="764" y2="520" stroke="#FFFFFF" stroke-width="2.5" marker-end="url(#arrow-light)"/>
    <text x="776" y="525" font-weight="600">Implementation dependencies</text>
    <text x="776" y="545" font-size="12.5" fill="#C9C6F5">point inward only; interfaces</text>
    <text x="776" y="562" font-size="12.5" fill="#C9C6F5">(0_interfaces) may cross any ring</text>
  </g>

  <text x="742" y="622" font-size="12.5" fill="#C9C6F5">An application is a program written in ML:</text>
  <text x="742" y="640" font-size="12.5" fill="#C9C6F5">JSON instances of Entity, Query, Transformer,</text>
  <text x="742" y="658" font-size="12.5" fill="#C9C6F5">Report and Action, stored in deployments and</text>
  <text x="742" y="676" font-size="12.5" fill="#C9C6F5">interpreted by the rings around the centre.</text>
</svg>
