# =============================================================================
# Miroir Framework — Docker Compose
# =============================================================================
# Quick-start:
#
#   docker compose up          # build image + start (first run seeds /data)
#   docker compose up -d       # run in background
#   docker compose down        # stop and remove the container
#
# Access the app at http://localhost:3080
#
# The named volume `miroir-data` persists your application data between runs.
# To start fresh:
#   docker compose down -v     # ⚠️ destroys all user data in the volume
#
# Configuration:
#   The server runs the `docker` environment (MIROIR_ROOT=/data, MIROIR_ENV=docker,
#   see docs/reference/docker.md). To change it, edit environments/docker.json
#   in the volume (/data/environments/docker.json) and restart.
# =============================================================================

services:
  miroir:
    image: miroir-framework/miroir-server:latest
    # pull_policy: build tells Compose to always use the locally-built image and
    # never attempt to pull from a registry, suppressing the spurious
    # "pull access denied" warning when the image doesn't exist remotely.
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host port 3080 → container port 3080 (plain HTTP)
      # Change the left-hand side to expose on a different host port, e.g. "8080:3080"
      - "3080:3080"
    volumes:
      # Named volume for user application data (auto-seeded with demo data on first run)
      - miroir-data:/data
    restart: unless-stopped
    # Optional: set log level via environment (requires server to read it; see README)
    # environment:
    #   - NODE_ENV=production
    #   # Wrapping key for Admin MiroirSecret rows (the only standing launch secret).
    #   # Generate: docs/reference/authentication.md#generate-the-wrapping-key
    #   - MIROIR_SECRETS_MASTER_KEY=

volumes:
  miroir-data:
    driver: local
