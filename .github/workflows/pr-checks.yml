name: PR checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: miroir-core typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check .claude/skills copies match .agents/skills
        run: python3 scripts/sync_agent_skills.py --check
      - name: Repo script tests
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest scripts/tests -q
      - name: Dependency policy
        run: python3 scripts/check_dependency_policy.py --rule specs --rule classification --rule lockfile --rule workflows --rule actions
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit
      - name: No high or critical advisory (npm audit)
        run: python3 scripts/check_dependency_policy.py --rule audit
      - name: Lint
        run: npm run lint
      - name: Build packages needed by miroir-core tests and miroir-env
        run: |
          npm run build -w miroir-test-app_deployment-miroir -w miroir-test-app_deployment-admin
          npm run build -w miroir-core
          npm run build -w miroir-env -w miroir-store-bundled -w miroir-store-postgres -w miroir-test-app_deployment-library
      - name: Environments valid, tracked assets unchanged (#321)
        run: npm run miroir-env -- check --strict --tracked-clean
      - name: Typecheck miroir-core
        run: npx tsc --noEmit --skipLibCheck -p packages/miroir-core/tsconfig.json
      - name: miroir-core unit tests
        run: npm run test -w miroir-core -- ''
