name: Build Miroir Artefacts
description: >
  builds all packages needed by Miroir runnables. This is reused by multiple
  workflows (e.g. build-sandbox-for-github-pages, build-mac, build-linux) to
  avoid duplicating the same build steps.

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        npm ci --no-audit

    # ── Build order per copilot-instructions.md ─────────────────────────
    # 1. Core type definitions (data deployed by miroir & admin test apps)
    - name: Build miroir-app-miroir
      shell: bash
      run: npm run build -w miroir-app-miroir

    - name: Build miroir-app-admin
      shell: bash
      run: npm run build -w miroir-app-admin

    - name: Build miroir-example-library
      shell: bash
      run: npm run build -w miroir-example-library

    # #672: fixture applications of the MiroirTest UI runtime (miroir-react-testing)
    - name: Build miroir-example-github and miroir-fixture-appForTest
      shell: bash
      run: npm run build -w miroir-example-github -w miroir-fixture-appForTest

    # 2. miroir-core with generated TypeScript types (devBuild)
    - name: Build miroir-core (with type generation)
      shell: bash
      run: npm run devBuild -w @miroir-framework/core

    # Parallel builds: a bare `wait` returns 0 whatever the jobs return, so each step waits on every pid and
    # fails as soon as one build failed (the composite shell runs with -e).
    - name: Build ai and mcp packages (depend on miroir-core)
      shell: bash
      run: |
        pids=()
        npm run build -w miroir-ai & pids+=($!)
        npm run build -w @miroir-framework/mcp & pids+=($!)
        for pid in "${pids[@]}"; do wait "$pid"; done

    - name: Build store, cache, and diagram packages
      shell: bash
      run: |
        pids=()
        npm run build -w @miroir-framework/store-bundled & pids+=($!)
        npm run build -w @miroir-framework/store-indexeddb & pids+=($!)
        npm run build -w @miroir-framework/env & pids+=($!)
        npm run build -w @miroir-framework/versioning & pids+=($!)
        npm run build -w miroir-localcache-redux & pids+=($!)
        npm run build -w miroir-localcache-zustand & pids+=($!)
        for pid in "${pids[@]}"; do wait "$pid"; done

    # 4. React bindings
    - name: Build miroir-react
      shell: bash
      run: |
        pids=()
        npm run build -w @miroir-framework/react & pids+=($!)
        npm run build -w miroir-diagram-class & pids+=($!)
        for pid in "${pids[@]}"; do wait "$pid"; done

    # #672: the MiroirTest UI runtime (imports @miroir-framework/react, @miroir-framework/mcp and the fixture apps)
    - name: Build miroir-react-testing
      shell: bash
      run: npm run build -w miroir-react-testing

    # Server-side stores
    - name: Build server-side store packages
      shell: bash
      run: |
        pids=()
        npm run build -w @miroir-framework/store-filesystem & pids+=($!)
        npm run build -w @miroir-framework/store-mongodb & pids+=($!)
        npm run build -w @miroir-framework/store-postgres & pids+=($!)
        for pid in "${pids[@]}"; do wait "$pid"; done
