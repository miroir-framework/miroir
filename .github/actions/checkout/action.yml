name: Checkout and Install Dependencies
description: >
  Checks out the repository, sets up Node.js 24, and installs exactly the
  package-lock.json versions with npm ci (the lockfile lists every platform's
  optional packages, e.g. @rollup/rollup-linux-x64-gnu).

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    - name: Install dependencies
      shell: bash
      run: |
        npm ci --no-audit