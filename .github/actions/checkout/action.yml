name: Checkout and Install Dependencies
description: >
  Checks out the repository, sets up Node.js 24, and installs exactly the
  package-lock.json versions with npm ci (the lockfile lists every platform's
  optional packages, e.g. @rollup/rollup-linux-x64-gnu).

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'

    - name: Install dependencies
      shell: bash
      run: |
        npm ci --no-audit