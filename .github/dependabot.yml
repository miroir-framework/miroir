# Dependency and action updates reach _integration only as Dependabot PRs, at least 7 days
# after their release (#326, docs/contributing/development-setup.md, Dependency policy).
# Security updates are the exception: Dependabot opens them against the default branch (main),
# whatever target-branch says.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: _integration
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    ignore:
      # React 19 needs react, react-dom and @types/* to move together: migrate deliberately.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # ag-grid-react renders the grid and ag-grid-community holds its CSS: they must share a major.
      - dependency-name: "ag-grid-community"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ag-grid-react"
        update-types: ["version-update:semver-major"]
      # @copilotkit/* pins an exact @ag-ui/* version, and miroir-ai hands its agents to CopilotRuntime:
      # a different @ag-ui/client gives two AbstractAgent types and breaks the build (#547). Bump
      # @ag-ui/* in miroir-ai together with CopilotKit, to the version it pins.
      - dependency-name: "@ag-ui/*"
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: _integration
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]