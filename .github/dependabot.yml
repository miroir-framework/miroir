# Dependency and action updates reach _integration only as Dependabot PRs, at least 7 days
# after their release (#326, docs/contributing/development-setup.md, Dependency policy).
# Security updates are the exception: Dependabot opens them against the default branch (main),
# whatever target-branch says.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: _integration
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # React 19 needs react, react-dom and their types moved together, with a migration.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: _integration
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]